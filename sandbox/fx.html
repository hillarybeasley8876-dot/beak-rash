<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>fx sandbox · BEAK RASH</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0f; font: 12px/1.3 system-ui, sans-serif; color: #fff; }
      #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #panel { position: fixed; top: 8px; left: 8px; width: 250px; max-height: calc(100vh - 16px); overflow: auto;
        background: rgba(11, 11, 15, 0.82); border: 2px solid #e5191c; padding: 8px; transform-origin: top left; }
      #panel.hidden { display: none; }
      #panel h3 { margin: 8px 0 4px; font-size: 12px; color: #ffe600; letter-spacing: 1px; }
      #panel button { margin: 2px; padding: 3px 6px; background: #e5191c; color: #fff; border: 0; cursor: pointer; font-size: 11px; }
      #panel button:hover { background: #ff1e3c; }
      #panel label { display: flex; justify-content: space-between; gap: 6px; align-items: center; margin: 2px 0; }
      #panel input[type=range] { width: 120px; }
      #atlas { position: fixed; right: 8px; bottom: 8px; width: 256px; height: 256px; background: #556; border: 2px solid #fff; display: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel"></div>
    <canvas id="atlas"></canvas>
    <script type="module" src="./fx.ts"></script>
  </body>
</html>
