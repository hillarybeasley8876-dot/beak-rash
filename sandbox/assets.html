<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEAK RASH — assets gallery</title>
    <link rel="icon" href="data:,">
    <style>
      :root { --red: #e5191c; --black: #0b0b0f; --cell: 300px; }
      html, body { margin: 0; background: #2a2a2e; color: #fff; font: 13px/1.3 system-ui, sans-serif; }
      header { display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: var(--black); }
      header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
      header .stat { color: #ffe600; font-weight: 700; }
      header .bad { color: #ff4d6d; }
      header button { background: #333; color: #fff; border: 1px solid #666; padding: 3px 9px; cursor: pointer; }
      header button.on { background: var(--red); border-color: var(--red); }
      section { padding: 8px 16px 14px; }
      h2 { margin: 6px 0 8px; font-size: 15px; color: #ffe600; text-transform: uppercase; letter-spacing: .08em; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; }
      .tile { position: relative; overflow: hidden; border: 2px solid #000; }
      .tile img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .tile .label { position: absolute; left: 0; bottom: 0; padding: 1px 5px; background: rgba(0,0,0,.75);
        color: #ffe600; font-size: 11px; }
      .tile.missing { outline: 3px solid #ff4d6d; }
      .tile.missing::after { content: 'MISSING'; position: absolute; inset: 0; display: grid; place-items: center;
        color: #ff4d6d; font-weight: 900; font-size: 20px; }
      /* backdrops for cut-outs: P5 split (default), red, black, checker, white */
      .bd { background: linear-gradient(118deg, var(--red) 0 55%, var(--black) 55% 100%); }
      body[data-bg="red"] .bd { background: var(--red); }
      body[data-bg="black"] .bd { background: var(--black); }
      body[data-bg="white"] .bd { background: #fff; }
      body[data-bg="checker"] .bd { background: repeating-conic-gradient(#bbb 0 25%, #888 0 50%) 0 0 / 16px 16px; }
      .char { width: var(--cell); background: #1b1b1f; border: 2px solid #000; padding: 6px; box-sizing: border-box; }
      .char .name { font-weight: 800; margin: 0 0 4px; }
      .char .row { display: flex; gap: 4px; }
      .char .main { width: 100%; height: 260px; }
      .char .bust { flex: 1; height: 150px; }
      .char .eyes { width: 100%; aspect-ratio: 16 / 9; margin-top: 4px; }
      /* P5 cut-in mock: the eyes strip inside a skewed band, as the HUD shows it */
      .cutin { margin: 20px 0 16px; height: 44px; transform: skewY(-6deg); border: 3px solid #000;
        background: var(--black); overflow: hidden; }
      .cutin img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
      .wide { width: 520px; aspect-ratio: 16 / 9; }
      .cut { height: 300px; }
      .bill { width: 250px; aspect-ratio: 16 / 9; }
    </style>
  </head>
  <body data-bg="split">
    <header>
      <h1>BEAK RASH · assets</h1>
      <span class="stat" id="stat">loading…</span>
      <span>backdrop:</span>
      <button data-bg="split" class="on">P5 split</button>
      <button data-bg="red">red</button>
      <button data-bg="black">black</button>
      <button data-bg="checker">checker</button>
      <button data-bg="white">white</button>
    </header>
    <section><h2>Portraits — main · smug · hurt · eyes (+ cut-in band mock)</h2><div class="grid" id="portraits"></div></section>
    <section><h2>Key art</h2><div class="grid" id="art"></div></section>
    <section><h2>Billboards</h2><div id="billboards"></div></section>
    <script type="module" src="./assets.ts"></script>
  </body>
</html>
