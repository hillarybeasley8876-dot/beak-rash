<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>sim sandbox — feel bench (BEAK RASH)</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.35 system-ui, sans-serif; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #feel { position: fixed; right: 10px; top: 10px; width: 300px; color: #fff; background: rgba(11, 11, 15, 0.84);
        border-left: 4px solid #e5191c; padding: 8px 10px; z-index: 10; user-select: none; }
      #feel h1 { margin: 0 0 4px; font: 900 15px/1 system-ui; letter-spacing: 0.05em; }
      #feel label { display: grid; grid-template-columns: 96px 1fr 46px; gap: 4px; align-items: center; margin: 1px 0; }
      #feel input[type=range] { width: 100%; }
      #feel button { font: inherit; margin: 2px 2px 0 0; background: #fff; color: #0b0b0f; border: 0; padding: 2px 6px; cursor: pointer; }
      #feel button.on { background: #e5191c; color: #fff; }
      #feel .sec { margin-top: 6px; color: #ffe600; font-weight: 700; }
      #feel pre { margin: 4px 0 0; color: #ffe600; font: 11px/1.3 ui-monospace, monospace; white-space: pre; }
      #graph { position: fixed; left: 10px; bottom: 10px; width: 560px; height: 210px; z-index: 10;
        background: rgba(11, 11, 15, 0.72); border-left: 4px solid #e5191c; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <canvas id="graph" width="560" height="210"></canvas>
    <div id="feel"></div>
    <script type="module" src="./sim.ts"></script>
  </body>
</html>
